name: Build and Publish

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /opt/hostedtoolcache /usr/local/.ghcup
          sudo docker system prune -af 2>/dev/null || true
          df -h /

      - name: Read versions
        id: versions
        run: |
          grep -v '^#' env/versions.env | grep -v '^$' >> "$GITHUB_OUTPUT"

      - name: Normalize image name
        run: |
          echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Generate image tags
        id: tags
        run: |
          VERSION_TAG="ubuntu${{ steps.versions.outputs.UBUNTU_VERSION }}-torch${{ steps.versions.outputs.TORCH_VERSION }}"
          SHA_TAG="sha-${GITHUB_SHA::8}"
          echo "version=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare .build directory
        run: |
          mkdir -p .build

          echo "==> Downloading opencode v${{ steps.versions.outputs.OPENCODE_VERSION }}..."
          VER="${{ steps.versions.outputs.OPENCODE_VERSION }}"
          FOUND=false

          download() {
            local url="$1"
            echo "  Trying: $url"
            curl -fSL --retry 2 -o .build/opencode "$url" 2>/dev/null && return 0
            return 1
          }

          for url in \
            "https://github.com/opencode-ai/opencode/releases/download/v${VER}/opencode-linux-amd64" \
            "https://github.com/opencode-ai/opencode/releases/download/v${VER}/opencode-linux-x64" \
            "https://github.com/anomalyco/opencode/releases/download/v${VER}/opencode-linux-amd64" \
            "https://github.com/anomalyco/opencode/releases/download/v${VER}/opencode-linux-x64"; do
            if download "$url"; then
              chmod +x .build/opencode
              FOUND=true
              break
            fi
          done

          if ! $FOUND; then
            echo "  Trying npm install..."
            npm install -g opencode 2>/dev/null && FOUND=true && cp $(which opencode) .build/opencode || true
            npm install -g @opencode-ai/cli 2>/dev/null && FOUND=true && cp $(which opencode) .build/opencode || true
          fi

          if $FOUND; then
            echo "  -> opencode downloaded"
          else
            echo "  -> opencode not available, will be skipped in image"
          fi

          echo "==> .build/ contents:"
          ls -la .build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UBUNTU_VERSION=${{ steps.versions.outputs.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ steps.versions.outputs.PYTHON_VERSION }}
            TORCH_VERSION=${{ steps.versions.outputs.TORCH_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.sha }}

      - name: Smoke test — container starts
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.sha }} \
            bash -c "echo 'Container OK'; python3 --version; uname -a; lscpu | grep -i 'model name'"

      - name: Smoke test — Python imports
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.sha }} \
            bash -c "
              source /workspace/.venv/bin/activate
              python -c 'import torch; assert \"${{ steps.versions.outputs.TORCH_VERSION }}\" in torch.__version__; print(torch.__version__)'
              python -c 'import numpy; print(numpy.__version__)'
              python -c 'import cmake; print(cmake.__version__)'
              python -c 'import transformers; print(transformers.__version__)'
              python -c 'import fastapi; print(fastapi.__version__)'
            "

      - name: Smoke test — verify.sh
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.sha }} \
            bash /workspace/scripts/verify.sh || true

      - name: Push to registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            UBUNTU_VERSION=${{ steps.versions.outputs.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ steps.versions.outputs.PYTHON_VERSION }}
            TORCH_VERSION=${{ steps.versions.outputs.TORCH_VERSION }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.REPO }}:${{ steps.tags.outputs.sha }}
